<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>i-bay · IIM Indore campus marketplace</title>
<meta name="theme-color" content="#02505F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%2302505F%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2234%22 text-anchor=%22middle%22 fill=%22%231FC9B2%22%3Ei%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3EBED;--surface:#FEFEFE;--surface-2:#F4F7F8;--sunken:#EBF0F1;--photo:#EEF3F4;
  --line:rgba(2,32,38,.10);--line-2:rgba(2,32,38,.16);
  --ink:#20373C;--ink-2:#3F6068;--ink-3:#567379;
  --brand:#02505F;--brand-hover:#02637A;--brand-ink:#02637A;--brand-soft:rgba(2,99,122,.10);--on-brand:#FFFFFF;
  --mint:#23DFC6;--mint-soft:rgba(35,223,198,.16);--mint-ink:#04695C;--on-mint:#03322B;
  --good:#15702F;--good-soft:rgba(37,161,73,.13);--bad:#BB2C22;--bad-soft:rgba(223,82,74,.13);--warn:#D99A1B;--warn-soft:rgba(217,154,27,.16);--warn-ink:#7A5610;
  --glass:color-mix(in srgb,#F9FBFB 78%,transparent);--glass-edge:rgba(255,255,255,.72);
  --shr:inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(2,32,38,.06),0 1px 2px rgba(2,32,38,.10),0 3px 7px -3px rgba(2,32,38,.12);
  --shw:inset 0 2px 3px rgba(2,32,38,.12),inset 0 0 0 1px rgba(2,32,38,.05),inset 0 -1px 0 rgba(255,255,255,.80);
  --shg:0 1px 1px rgba(2,32,38,.04),0 4px 10px -4px rgba(2,32,38,.10),0 18px 34px -18px rgba(2,32,38,.22);
  --btn-sh:0 1px 0 rgba(255,255,255,.18) inset,0 4px 10px -4px rgba(2,80,95,.55);
  --wash:radial-gradient(120% 60% at 10% -10%,rgba(35,223,198,.14) 0%,transparent 60%),radial-gradient(90% 50% at 100% 0%,rgba(2,80,95,.08) 0%,transparent 58%);
  --hero:linear-gradient(120deg,#02505F 0%,#02637A 60%,#0A7E88 100%);--hero-ink:#FFFFFF;--hero-ink-2:rgba(255,255,255,.82);
  --focus:0 0 0 3px rgba(35,223,198,.45);
  --pk:#02505F;--pk2:#02637A;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0F1314;--surface:#181E20;--surface-2:#1E2528;--sunken:#121718;--photo:#E4E9EA;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --ink:#E6ECEE;--ink-2:#A8B5B9;--ink-3:#85959A;
  --brand:#5CC4CF;--brand-hover:#77D0D9;--brand-ink:#7FD1DA;--brand-soft:rgba(92,196,207,.12);--on-brand:#04262B;
  --mint-soft:rgba(35,223,198,.12);--mint-ink:#5CE3D0;
  --good:#6FCF8B;--good-soft:rgba(111,207,139,.13);--bad:#FF8A80;--bad-soft:rgba(255,138,128,.13);--warn:#E3AE47;--warn-soft:rgba(227,174,71,.13);--warn-ink:#EAC06B;
  --glass:color-mix(in srgb,#15191B 84%,transparent);--glass-edge:rgba(255,255,255,.06);
  --shr:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.45),0 6px 14px -6px rgba(0,0,0,.55);
  --shw:inset 0 2px 4px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06);
  --shg:0 0 0 1px rgba(255,255,255,.07),0 20px 40px -16px rgba(0,0,0,.8);
  --btn-sh:none;
  --wash:none;
  --hero:linear-gradient(120deg,#1C2427 0%,#1F282B 100%);--hero-ink:#E6ECEE;--hero-ink-2:#A8B5B9;
  --pk:#2EA7B3;--pk2:#1E8995;
  color-scheme:dark;
}

:root{--outer:#D3DFE2;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--col:560px}
[data-theme=dark]{--outer:#0A0D0E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--outer);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--brand-ink);text-decoration:none;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:12px}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.sm{font-size:12.5px}.xs{font-size:11.5px}
h1{font-size:22px;line-height:1.2;letter-spacing:-.02em;font-weight:700}
h2{font-size:17px;letter-spacing:-.01em;font-weight:700}
h3{font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.icon{width:20px;height:20px;flex:none}
.i14{width:14px;height:14px}.i16{width:16px;height:16px}.i18{width:18px;height:18px}.i24{width:24px;height:24px}.i28{width:28px;height:28px}.i40{width:40px;height:40px}
/* shell */
#shell{max-width:var(--col);margin:0 auto;min-height:100dvh;background:var(--wash),var(--bg);position:relative}
@media (min-width:600px){#shell{box-shadow:0 0 0 1px var(--line),0 40px 90px -40px rgba(0,0,0,.45)}}
main{padding:12px 14px calc(104px + var(--safe-b))}
main.flush{padding-top:0}
main.withbar{padding-bottom:calc(110px + var(--safe-b))}
/* top bar */
.tb{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--glass-edge);padding:calc(var(--safe-t) + 6px) 10px 8px}
.tb-row{display:flex;align-items:center;gap:4px;min-height:46px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.ib:active{background:var(--sunken)}
.ib .icon{width:22px;height:22px}
.brand{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--brand-ink)}
.tb-title{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.signin{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-weight:600;font-size:13px;box-shadow:var(--btn-sh)}
.cnt{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;border:2px solid var(--surface)}
.loc{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);padding:2px 4px 6px}
.loc .icon{width:14px;height:14px;color:var(--brand-ink)}
.spill{display:flex;align-items:center;gap:10px;width:100%;height:46px;border-radius:999px;background:var(--surface);box-shadow:var(--shr);padding:0 6px 0 16px;color:var(--ink-3);text-align:left;font-size:14px}
.spill>span:not(.go){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spill .go{flex:none;width:36px;height:36px;border-radius:999px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.spill .go .icon{width:18px;height:18px}
/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--col));z-index:45;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--glass-edge);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + var(--safe-b))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink-3);padding:4px 0;position:relative;min-height:50px;justify-content:center}
.tab .icon{width:23px;height:23px}
.tab.on{color:var(--brand-ink)}
.tab.on::before{content:'';position:absolute;top:-6px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.tab .cnt{top:0;right:calc(50% - 22px)}
.sellfab{width:54px;height:54px;border-radius:19px;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px -6px rgba(35,223,198,.75),0 0 0 4px var(--bg)}
.sellfab .icon{width:26px;height:26px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14.5px;background:var(--brand);color:var(--on-brand);box-shadow:var(--btn-sh);white-space:nowrap;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface);color:var(--brand-ink);box-shadow:var(--shr)}
.btn.mint{background:var(--mint);color:var(--on-mint);box-shadow:0 6px 14px -6px rgba(35,223,198,.7)}
.btn.quiet{background:transparent;color:var(--brand-ink);box-shadow:none;padding:0 10px}
.btn.danger{background:var(--surface);color:var(--bad);box-shadow:var(--shr)}
.btn.small{min-height:36px;padding:0 14px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .icon{width:18px;height:18px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;border-radius:999px;background:#fff;color:#1F1F1F;font-weight:600;font-size:14.5px;box-shadow:0 0 0 1px #DADCE0,0 1px 2px rgba(0,0,0,.08)}
[data-theme=dark] .gbtn{background:#131314;color:#E3E3E3;box-shadow:0 0 0 1px #8E918F}
/* form */
.field{display:flex;flex-direction:column;gap:7px}
.label{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.label .icon{width:14px;height:14px}
.input{width:100%;min-height:48px;padding:12px 16px;border:0;border-radius:16px;background:var(--sunken);box-shadow:var(--shw);outline:none;font-size:16px}
.input:focus{box-shadow:var(--shw),0 0 0 2px var(--mint)}
textarea.input{min-height:96px;resize:vertical}
.iwrap{position:relative}.iwrap .icon{position:absolute;left:14px;top:14px;color:var(--ink-3)}.iwrap .input{padding-left:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shr);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip .icon{width:15px;height:15px}
.chip.on{background:var(--brand);color:var(--on-brand);box-shadow:none;font-weight:600}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:4px 14px 8px}
.chiprow::-webkit-scrollbar,.hrail::-webkit-scrollbar,.stories::-webkit-scrollbar,.carousel::-webkit-scrollbar,.gtrack::-webkit-scrollbar,.days::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--sunken);box-shadow:var(--shw);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);box-shadow:var(--shr);color:var(--brand-ink)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--sunken);box-shadow:var(--shw);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--brand);box-shadow:none}.sw.on::after{left:22px}
/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge .icon{width:11px;height:11px}
.b-rent{background:var(--brand-soft);color:var(--brand-ink)}.b-auction{background:var(--warn-soft);color:var(--warn-ink)}.b-drop{background:var(--bad-soft);color:var(--bad)}.b-sell{background:var(--mint-soft);color:var(--mint-ink)}.b-near{background:var(--good-soft);color:var(--good)}.b-neutral{background:var(--sunken);color:var(--ink-2)}
.trust{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600}
.trust .icon{width:12px;height:12px}
.t-good{color:var(--good)}.t-new{color:var(--ink-2)}.t-bad{color:var(--bad)}
.age{position:absolute;left:7px;bottom:7px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:999px;box-shadow:0 2px 6px -2px rgba(0,0,0,.35);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.age::before{content:'';width:5px;height:5px;border-radius:99px;background:currentColor;opacity:.85}
.age.big{position:static;font-size:11px;padding:6px 11px;box-shadow:none}
.a-fresh{background:#15803D;color:#fff}.a-good{background:#02637A;color:#fff}.a-aging{background:#E0A526;color:#3A2A05}.a-old{background:#C2372C;color:#fff}.a-unk{background:#E3E8EA;color:#3F6068}
/* panels */
.panel{background:var(--surface);border-radius:20px;box-shadow:var(--shr)}
.pad{padding:16px}
section.sec{margin-top:24px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{display:flex;align-items:center;gap:8px}
.sh h2 .icon{width:20px;height:20px;color:var(--brand-ink)}
.sh a{font-size:13px;font-weight:600;display:flex;align-items:center;gap:2px}
.sh a .icon{width:16px;height:16px}
.sub{font-size:12px;color:var(--ink-3);margin-top:-6px;margin-bottom:10px}
/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;margin:0 -14px;padding:6px 14px 4px}
.story{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;text-align:center;line-height:1.2}
.story .ring{width:66px;height:66px;border-radius:999px;padding:2.5px;background:var(--line-2)}
.story.hot .ring{background:conic-gradient(from 200deg,#23DFC6,#02637A,#E0A526,#23DFC6)}
.story .ring>span{width:100%;height:100%;border-radius:999px;background:var(--photo);border:3px solid var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--brand-ink)}
.story img{max-width:70%;max-height:70%;mix-blend-mode:multiply}
.story img.cover{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;object-position:top}
.story svg.art{width:84%;height:84%}
/* carousel */
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -14px;padding:2px 14px}
.slide{flex:0 0 100%;scroll-snap-align:center;border-radius:22px;background:var(--hero);color:var(--hero-ink);min-height:184px;display:grid;grid-template-columns:1.25fr .9fr;overflow:hidden;position:relative;box-shadow:var(--shg)}
.slide .t{padding:18px 4px 18px 18px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.slide .eb{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mint);font-weight:600;display:flex;align-items:center;gap:5px}
.slide .eb .icon{width:13px;height:13px}
.slide h3{font-size:19px;line-height:1.2;font-weight:700;color:var(--hero-ink)}
.slide p{font-size:12px;color:var(--hero-ink-2)}
.slide .pics{position:relative}
.slide .pics div{position:absolute;bottom:-6px;width:58%;aspect-ratio:3/4;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);display:grid;place-items:center}
.slide .pics div:nth-child(1){right:34%;transform:rotate(-6deg);bottom:4px}
.slide .pics div:nth-child(2){right:6%;transform:rotate(5deg);z-index:1}
.slide .pics img{width:100%;height:100%;object-fit:cover}
.slide .pics img.fit{width:80%;height:80%;object-fit:contain}
.cdots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.cdots i{width:6px;height:6px;border-radius:99px;background:var(--line-2);transition:width .2s}
.cdots i.on{width:18px;background:var(--brand)}
/* live strip */
.live{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shr);width:100%;text-align:left}
.live .ph{width:52px;height:52px;border-radius:12px;flex:none}
.pulse{width:8px;height:8px;border-radius:99px;background:var(--bad);box-shadow:0 0 0 0 rgba(223,82,74,.6);animation:pl 1.6s infinite;flex:none}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(223,82,74,0)}100%{box-shadow:0 0 0 0 rgba(223,82,74,0)}}
/* rails & grid */
.hrail{display:grid;grid-auto-flow:column;grid-auto-columns:calc(46% - 6px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:2px 14px 10px}
.hrail>*{scroll-snap-align:start}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:480px){.hrail{grid-auto-columns:calc(36% - 6px)}}
/* product card */
.pc{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shr);overflow:hidden;text-align:left;width:100%}
.pc:active{transform:scale(.985)}
.ph{position:relative;aspect-ratio:1/1;background:var(--photo);display:grid;place-items:center;overflow:hidden}
.pc>.ph{margin:6px 6px 0;border-radius:14px}
.ph img{width:auto;height:auto;max-width:80%;max-height:80%;object-fit:contain;mix-blend-mode:multiply}
.ph img.cover{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;mix-blend-mode:normal}
[data-theme=dark] .ph{filter:brightness(.92)}
.ph>.badge{position:absolute;top:7px;left:7px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
[data-theme=dark] .ph>.badge.b-rent{color:#02637A}[data-theme=dark] .ph>.badge.b-auction{color:#7A5610}[data-theme=dark] .ph>.badge.b-drop{color:#BB2C22}[data-theme=dark] .ph>.badge.b-sell{color:#04695C}
.heart{position:absolute;top:5px;right:5px;width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.94);display:grid;place-items:center;color:#3F6068;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.heart.on{color:#D6453B}.heart.on svg{fill:currentColor}
.heart .icon{width:17px;height:17px}
.pc .bd{padding:8px 10px 11px;display:flex;flex-direction:column;gap:2px;flex:1}
.pc .tt{font-size:12.5px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.price{font-size:16px;font-weight:700;letter-spacing:-.02em}
.price small{font-size:11.5px;font-weight:500;color:var(--ink-2)}
.mrp{font-size:11px;color:var(--ink-3);text-decoration:line-through;font-weight:400;margin-left:4px}
.off{font-size:11px;color:var(--good);font-weight:600;margin-left:3px}
.pc .meta{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .meta .icon{width:12px;height:12px;flex:none}
.pc .who{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);margin-top:auto;padding-top:5px;white-space:nowrap;overflow:hidden}
.near{color:var(--good);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.near .icon{width:12px;height:12px}
.art{width:70%;height:70%}
.ticket{width:84%;aspect-ratio:1.7/1;border-radius:12px;background:linear-gradient(135deg,#02505F,#0B7C88);color:#fff;display:flex;overflow:hidden;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
.ticket .tm{flex:1;padding:10% 8%;display:flex;flex-direction:column;justify-content:space-between}
.ticket .tm b{font-size:12px;line-height:1.15}
.ticket .tm span{font-size:8px;opacity:.8;font-family:'JetBrains Mono',monospace}
.ticket .ts{width:26%;border-left:2px dashed rgba(255,255,255,.5);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:8px;writing-mode:vertical-rl;letter-spacing:.1em;background:rgba(0,0,0,.12)}
/* moments, tiles */
.moment{flex:none;width:220px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;scroll-snap-align:start}
.th3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.th3 span{aspect-ratio:1;border-radius:10px;background:var(--photo);display:grid;place-items:center;overflow:hidden}
.th3 img{max-width:80%;max-height:80%;mix-blend-mode:multiply}
.th3 img.cover{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;object-position:top}
.th3 svg.art{width:85%;height:85%}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;text-align:center;font-weight:600;font-size:11.5px;line-height:1.2;background:var(--surface);border-radius:18px;box-shadow:var(--shr)}
.tile .ci{width:58px;height:58px;border-radius:16px;background:var(--photo);display:grid;place-items:center;overflow:hidden}
.tile .ci img{max-width:78%;max-height:78%;mix-blend-mode:multiply}
.tile .ci img.cover{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;object-position:top}
.tile .ci svg.art{width:90%;height:90%}
.grp{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-weight:700;font-size:15px}
.grp .icon{width:18px;height:18px;color:var(--brand-ink)}
/* list rows */
.lgroup{background:var(--surface);border-radius:20px;box-shadow:var(--shr);overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--sunken)}
.lrow .li{width:36px;height:36px;border-radius:12px;background:var(--sunken);display:grid;place-items:center;color:var(--brand-ink);flex:none}
.lrow .li .icon{width:19px;height:19px}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-size:14px;font-weight:600}
.lrow .lt span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow>.icon{color:var(--ink-3);width:18px;height:18px}
.av{border-radius:99px;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;background-size:cover;background-position:center}
/* item page */
.gal{position:relative;margin:0 -14px}
.gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.gslide{flex:0 0 100%;aspect-ratio:1/1;background:var(--photo);display:grid;place-items:center;scroll-snap-align:center;overflow:hidden}
.gslide img{max-width:82%;max-height:82%;mix-blend-mode:multiply}
.gslide img.cover{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;mix-blend-mode:normal}
.gslide .art{width:72%;height:72%}
[data-theme=dark] .gslide{filter:brightness(.94)}
.gdots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gdots i{width:6px;height:6px;border-radius:99px;background:rgba(0,0,0,.25)}
.gdots i.on{width:18px;background:#02505F}
.fbtn{position:absolute;top:calc(var(--safe-t) + 10px);width:42px;height:42px;border-radius:999px;background:rgba(255,255,255,.94);color:#20373C;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:2}
.fbtn .icon{width:21px;height:21px}
.fbtn.on{color:#D6453B}.fbtn.on svg{fill:currentColor}
.gtag{position:absolute;left:14px;bottom:12px;z-index:1}
.ititle{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.facts{display:flex;flex-direction:column}
.fact{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line-2);font-size:13.5px}
.fact:last-child{border-bottom:0}
.fact .icon{width:18px;height:18px;color:var(--ink-3)}
.fact span{flex:1;color:var(--ink-3)}
.fact b{font-weight:600;text-align:right}
.bullets{padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.sellerc{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left}
.review{padding:12px 0;border-bottom:1px dashed var(--line-2);display:flex;gap:12px}
.review:last-child{border-bottom:0}
.score{min-width:42px;height:28px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:12.5px;font-family:'JetBrains Mono',monospace;flex:none}
.s-good{background:var(--good-soft);color:var(--good)}.s-mid{background:var(--sunken);color:var(--ink-2)}.s-bad{background:var(--bad-soft);color:var(--bad)}
.note{display:flex;gap:9px;font-size:12.5px;color:var(--ink-2);align-items:flex-start}
.note .icon{width:16px;height:16px;margin-top:1px;color:var(--ink-3)}
/* sticky action bar */
.actbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--col));z-index:45;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--glass-edge);padding:10px 14px calc(10px + var(--safe-b));display:flex;align-items:center;gap:10px}
.actbar .pr{flex:1;min-width:0;line-height:1.2}
.actbar .pr b{font-size:18px;font-weight:700;display:block}
.actbar .pr span{font-size:11px;color:var(--ink-3)}
.actbar .btn{min-height:50px}
.sqbtn{width:50px;height:50px;border-radius:16px;background:var(--surface);box-shadow:var(--shr);display:grid;place-items:center;color:var(--brand-ink);flex:none}
/* booking widgets */
.days{display:grid;grid-auto-flow:column;grid-auto-columns:54px;gap:7px;overflow-x:auto;padding:4px 2px 8px}
.day{height:64px;border-radius:16px;background:var(--surface);box-shadow:var(--shr);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:var(--ink-3);line-height:1.25}
.day b{font-size:18px;color:var(--ink);font-weight:600}
.day.in{background:var(--brand-soft);box-shadow:none}
.day.edge{background:var(--brand);color:var(--on-brand);box-shadow:none}
.day.edge b{color:var(--on-brand)}
.day[disabled]{background:var(--sunken);box-shadow:var(--shw);opacity:.5;text-decoration:line-through;pointer-events:none}
.dbar{display:block;width:26px;height:3px;border-radius:2px;background:var(--line-2);margin-top:3px;overflow:hidden}.dbar i{display:block;height:100%;background:var(--warn)}
.day.edge .dbar{background:rgba(255,255,255,.35)}
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tlr{grid-column:1/-1;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:5px;margin-top:6px}
.tlr .icon{width:13px;height:13px}
.slot{height:44px;border-radius:12px;background:var(--surface);box-shadow:var(--shr);font-size:13px;font-weight:600;display:flex;align-items:baseline;justify-content:center;gap:1px;padding-top:12px;color:var(--ink)}
.slot small{font-size:9px;font-weight:500;color:var(--ink-3)}
.slot.bk{background:repeating-linear-gradient(135deg,var(--sunken) 0 5px,var(--line-2) 5px 7px);box-shadow:var(--shw);color:var(--ink-3);text-decoration:line-through;pointer-events:none}
.slot.past{opacity:.35;pointer-events:none;box-shadow:none;background:var(--sunken)}
.slot.in{background:var(--brand-soft);box-shadow:none}
.slot.edge{background:var(--brand);color:var(--on-brand);box-shadow:none}.slot.edge small{color:var(--on-brand)}
.tleg{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2)}
.tleg span{display:inline-flex;align-items:center;gap:5px}.tleg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.lg-f{background:var(--surface);box-shadow:var(--shr)}.lg-b{background:repeating-linear-gradient(135deg,var(--sunken) 0 3px,var(--line-2) 3px 5px)}.lg-s{background:var(--brand)}
.calc{font-size:13.5px;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--sunken);box-shadow:var(--shw)}
.calc div{display:flex;justify-content:space-between}
.calc .tot{font-weight:700;font-size:15px;border-top:1px dashed var(--line-2);padding-top:8px;margin-top:2px}
.bidg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
/* requests */
.rq{display:flex;gap:10px;padding:14px;text-align:left;width:100%}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;flex:none;width:46px}
.vote button{width:40px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3);background:var(--surface);box-shadow:var(--shr)}
.vote button.on{color:var(--on-brand);background:var(--brand);box-shadow:none}
.vote small{font-size:9.5px;font-weight:500;color:var(--ink-3)}
/* deals */
.steps{display:flex;align-items:center;margin-top:10px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-3);flex:none;width:64px;text-align:center}
.st i{width:22px;height:22px;border-radius:99px;background:var(--sunken);box-shadow:var(--shw);display:grid;place-items:center;font-style:normal}
.st i .icon{width:13px;height:13px}
.st.done{color:var(--ink-2)}.st.done i{background:var(--good);box-shadow:none;color:#fff}
.st.cur{color:var(--ink);font-weight:600}.st.cur i{box-shadow:0 0 0 2px var(--brand)}
.st-l{flex:1;height:2px;background:var(--line-2);margin:0 -14px 18px}
.st-l.done{background:var(--good)}
/* rating */
.anchors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.anc{border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;background:var(--surface);box-shadow:var(--shr)}
.anc b{font-size:15px;font-family:'JetBrains Mono',monospace}
.anc.on{box-shadow:0 0 0 2px var(--brand);background:var(--brand-soft)}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
/* sell flow */
.prog{display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:99px;background:var(--line-2)}
.prog i.on{background:var(--brand)}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.type{padding:14px;border-radius:18px;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);box-shadow:var(--shr)}
.type .icon{width:22px;height:22px;color:var(--brand-ink)}
.type b{font-size:14px}.type span{font-size:11.5px;color:var(--ink-2);line-height:1.3}
.type.on{box-shadow:0 0 0 2px var(--brand);background:var(--brand-soft)}
.drop{border-radius:18px;padding:18px;display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--sunken);box-shadow:var(--shw);border:1.5px dashed var(--line-2)}
.drop .icon{width:28px;height:28px;color:var(--brand-ink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{width:72px;height:72px;border-radius:14px;background:var(--photo) center/cover;box-shadow:var(--shr)}
/* chat */
.thr{display:flex;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line);align-items:center}
.thr .tx{flex:1;min-width:0}
.thr .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--ink-2)}
.thr.unread .tx div{color:var(--ink);font-weight:600}
.ctxbar{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12.5px;width:100%;text-align:left}
.ctxbar .ph{width:42px;height:42px;border-radius:10px;flex:none}
.dealbar{padding:9px 14px;background:var(--good-soft);color:var(--good);font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.msgs{display:flex;flex-direction:column;gap:6px;padding:14px}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--surface);box-shadow:var(--shr);border-bottom-left-radius:6px}
.ofr{align-self:center;width:90%;border-radius:18px;padding:12px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:6px;background:var(--surface);box-shadow:var(--shr)}
.ofr b{font-size:18px}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--col));z-index:45;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--glass-edge);padding:8px 10px calc(8px + var(--safe-b))}
.qr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 8px}
.qr::-webkit-scrollbar{display:none}
.qr button{white-space:nowrap;font-size:12.5px;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shr);color:var(--ink-2)}
.cin{display:flex;gap:8px;align-items:center}
.cin input{flex:1;min-width:0;min-height:46px;border:0;border-radius:999px;padding:0 16px;outline:none;background:var(--sunken);box-shadow:var(--shw);font-size:16px}
.cin .rb{width:46px;height:46px;border-radius:999px;display:grid;place-items:center;flex:none}
.cin .send{background:var(--brand);color:var(--on-brand)}
.cin .ofb{background:var(--surface);box-shadow:var(--shr);color:var(--warn-ink)}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(8,16,18,.45);z-index:90;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--col));max-height:92dvh;overflow-y:auto;z-index:91;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:var(--shg);padding:8px 18px calc(18px + var(--safe-b));animation:up .28s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
.sheet.tall{height:88dvh;display:flex;flex-direction:column;padding-bottom:0}
@keyframes up{from{transform:translate(-50%,100%)}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line-2);margin:4px auto 12px}
.shd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.shd h2{display:flex;align-items:center;gap:8px}
.shd h2 .icon{color:var(--brand-ink)}
.x{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;color:var(--ink-2);background:var(--sunken);flex:none}
.x .icon{width:18px;height:18px}
.blurwrap{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(8,16,18,.35);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);animation:fade .2s}
.authcard{width:min(420px,100%);max-height:94dvh;overflow:auto;background:var(--surface);border-radius:28px;box-shadow:var(--shg);padding:22px 20px 20px;position:relative;animation:pop .25s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.authcard .x{position:absolute;top:14px;right:14px}
.or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line-2)}
.otp{display:flex;gap:7px;justify-content:space-between}
.otp input{width:100%;max-width:50px;height:58px;text-align:center;font-size:22px;font-weight:600;border:0;border-radius:14px;background:var(--sunken);box-shadow:var(--shw);outline:none;font-family:'JetBrains Mono',monospace}
.otp input:focus{box-shadow:var(--shw),0 0 0 2px var(--mint)}
.ctxprod{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--sunken);box-shadow:var(--shw)}
.ctxprod .ph{width:48px;height:48px;border-radius:10px;flex:none}
.drawer{position:fixed;top:0;bottom:0;left:max(0px,calc(50% - var(--col)/2));width:min(86%,340px);z-index:95;background:var(--surface);box-shadow:var(--shg);overflow-y:auto;animation:slin .25s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(20px + var(--safe-b))}
@keyframes slin{from{transform:translateX(-100%)}}
.dhead{padding:calc(var(--safe-t) + 18px) 18px 16px;background:var(--hero);color:var(--hero-ink)}
.dsec{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:16px 18px 6px}
.dl{display:flex;align-items:center;gap:14px;padding:11px 18px;width:100%;text-align:left;font-size:14px;font-weight:500}
.dl:active{background:var(--sunken)}
.dl .icon{width:20px;height:20px;color:var(--ink-2)}
.dl .end{margin-left:auto;color:var(--ink-3)}
.dl.hot .icon{color:var(--warn-ink)}
.dsub{padding-left:52px;font-size:13px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);z-index:120;background:#0B1E22;color:#fff;padding:11px 16px;border-radius:16px;font-size:13px;box-shadow:var(--shg);display:flex;gap:10px;align-items:center;animation:tin .2s;width:max-content;max-width:min(92vw,520px)}
[data-theme=dark] .toast{background:#E6ECEE;color:#0F1314}
.toast a{color:var(--mint);font-weight:600;white-space:nowrap}
[data-theme=dark] .toast a{color:#02637A}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.mayu{position:fixed;right:max(14px,calc(50% - var(--col)/2 + 14px));bottom:calc(88px + var(--safe-b));z-index:44;width:54px;height:54px;border-radius:99px;background:var(--surface);box-shadow:var(--shg),0 0 0 3px var(--mint);display:grid;place-items:center}
.bm{max-width:88%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.45}
.bm.me{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:6px}
.bm.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.mini{display:flex;gap:10px;align-items:center;padding:6px;border-radius:14px;background:var(--surface);box-shadow:var(--shr);width:100%;text-align:left;margin-top:8px}
.mini .ph{width:50px;height:50px;border-radius:10px;flex:none}
.typing span{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--ink-3);margin-right:3px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.2}}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:40px 20px;color:var(--ink-2)}
.empty .ei{width:72px;height:72px;border-radius:24px;background:var(--surface);box-shadow:var(--shr);display:grid;place-items:center;color:var(--brand-ink)}
.empty .ei .icon{width:32px;height:32px}
.agekey{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-bottom:10px}
.agekey span{display:inline-flex;align-items:center;gap:4px}.agekey i{width:9px;height:9px;border-radius:99px;display:inline-block}
.stat{padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.stat .icon{width:20px;height:20px;color:var(--brand-ink)}
.stat b{font-size:24px;letter-spacing:-.02em}
.plumebar{height:8px;border-radius:99px;background:var(--sunken);box-shadow:var(--shw);overflow:hidden}
.plumebar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--brand))}

/* ================= responsive: tablet + desktop ================= */
.itemcols{display:block}
@media (min-width:720px){
 :root{--col:960px}
 #shell{box-shadow:none}
 main{padding-left:24px;padding-right:24px}
 .tb{padding-left:18px;padding-right:18px}
 .g2{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
 .hrail{grid-auto-columns:calc(27% - 8px);margin:0 -24px;padding:2px 24px 10px}
 .stories,.carousel{margin:0 -24px;padding-left:24px;padding-right:24px}

.lk-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(223,82,74,.1);color:var(--bad)}
.slide .pics svg.art{width:86%;height:86%}
@media (min-width:1080px){.dscroll{-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}}
/* ===== material-style category picker in search ===== */
@media (min-width:1080px){
 .dsearch{overflow:visible;position:relative;align-items:center}
 .dsc{position:relative;height:100%;display:flex;align-items:center;flex:none}
 .dsc-b{display:inline-flex;align-items:center;gap:8px;height:40px;margin:0 4px 0 4px;padding:0 12px 0 14px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1;white-space:nowrap;transition:background .15s}
 .dsc-b:hover,.dsc.open .dsc-b{background:var(--sunken)}
 .dsc-b .icon{flex:none;display:block}
 .dsc-chev{transition:transform .2s;color:var(--ink-3)}
 .dsc.open .dsc-chev{transform:rotate(180deg)}
 .dsc::after{content:'';width:1px;height:24px;background:var(--line-2);margin-left:4px}
 .dsc-m{position:absolute;top:calc(100% + 10px);left:0;z-index:90;background:var(--surface);border-radius:18px;padding:8px;width:560px;box-shadow:0 12px 32px -8px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.08),0 0 0 1px var(--line);display:none;grid-template-columns:repeat(4,1fr);gap:2px 4px;transform-origin:top left}
 .dsc.open .dsc-m{display:grid;animation:mpop .16s cubic-bezier(.2,.9,.3,1)}
 .dsc-all{grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
 .dsc-g{display:flex;flex-direction:column}
 .dsc-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px 4px}
 .dsc-i{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px 0 12px;border-radius:10px;font-size:13.5px;color:var(--ink);text-align:left}
 .dsc-i .icon{color:var(--ink-3);flex:none}
 .dsc-i span{flex:1}
 .dsc-i:hover{background:var(--sunken)}
 .dsc-i.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
 .dsc-i.on .icon{color:var(--brand-ink)}
 .dsearch input{padding-left:12px}
}
@keyframes mpop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
/* ===== desktop: price + buy panel ===== */
.vc-buy{display:none}
@media (min-width:1080px){
 .vc-buy{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line-2);padding-top:14px;margin-top:2px}
 .vc-buy>.btn{min-height:52px;font-size:15px;border-radius:16px}
 .vc-sec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .vc-sec.one{grid-template-columns:1fr}
 .vc-sec .btn{min-height:46px;width:100%;border-radius:14px;justify-content:center}
 .vcard{padding:20px 22px!important}
 .bbnote{justify-content:center;margin-top:2px}
}
@media (min-width:1080px){.vc-sec .btn,.vc-buy .btn{margin:0!important}}
/* ===== phones & tablets: edge to edge, no boxed column ===== */
@media (max-width:1079px){
 :root{--col:100vw}
 #shell{max-width:none!important;box-shadow:none!important;background:var(--wash),var(--bg)}
 body{background:var(--bg)}
 .tabbar,.actbar,.composer,.sheet{width:100%!important}
 .drawer{left:0!important}
 .mayu{right:14px!important}
 .carousel{scroll-padding-inline:14px}
}
@media (min-width:720px) and (max-width:1079px){.carousel{scroll-padding-inline:24px}}
@media (min-width:1080px){
 main.formpage{max-width:820px}
 .formpage ~ .actbar{width:min(820px,100vw);border-radius:20px 20px 0 0}
 #shell>.tb:has(+ main.formpage){max-width:820px}
 .formpage .types{grid-template-columns:repeat(4,minmax(0,1fr))}
}
/* ===== validation, captcha, CRUD table ===== */
.input.bad{box-shadow:var(--shw),0 0 0 2px var(--bad)!important}
.ferr{display:flex;align-items:center;gap:6px;color:var(--bad);font-size:12.5px;font-weight:500;margin-top:2px}
.ferr .icon{flex:none}
.cap{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);max-width:340px;min-height:62px}
.cap-box{width:26px;height:26px;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line-2);display:grid;place-items:center;flex:none;color:#fff}
.cap-box:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--brand)}
.cap.ok .cap-box{background:#15803D;box-shadow:none}
.cap-spin{width:18px;height:18px;border-radius:99px;border:2.5px solid var(--line-2);border-top-color:var(--brand);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cap-t{flex:1;font-size:13.5px;font-weight:500}
.cap.ok .cap-t{color:#15803D}
.cap-b{display:flex;align-items:center;gap:5px;color:var(--ink-3);line-height:1.05}
.cap-b b{display:block;font-size:10px;letter-spacing:.06em}
.cap-b small{font-size:9px}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.btn.danger-o{color:var(--bad)!important}
.ib.sm{width:32px;height:32px;border-radius:10px}
.ib.sm:hover{background:var(--sunken)}
.ib.danger{color:var(--bad)}
.danger-zone{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;box-shadow:inset 0 0 0 1.5px rgba(223,82,74,.35);background:rgba(223,82,74,.05)}
.danger-zone b{display:block;color:var(--bad);font-size:14px}
.pdrop{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--good);background:var(--good-soft);padding:2px 7px;border-radius:99px;margin-top:3px;width:max-content}
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 12px}
.tbar .seg{flex:1 1 auto;margin:0;overflow-x:auto}
.tsearch{flex:1 1 220px;max-width:320px}
.tsearch .input{min-height:40px;padding-top:6px;padding-bottom:6px}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.st-active{background:var(--good-soft);color:var(--good)}
.st-paused{background:var(--warn-soft);color:var(--warn-ink)}
.st-deleted{background:var(--bad-soft);color:var(--bad)}
.tblwrap{display:none;padding:0;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.gone{opacity:.6}
.tbl .r{text-align:right}
.thb{display:inline-flex;align-items:center;gap:3px;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.thb:hover,.thb.on{color:var(--brand-ink)}
.tcell{display:flex;align-items:center;gap:10px;text-align:left;max-width:340px}
.tcell b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.tph{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none}
.pin{width:92px;height:34px;border-radius:10px;border:0;background:var(--sunken);box-shadow:var(--shw);padding:0 10px;font:inherit;font-weight:700;color:var(--ink)}
.pin:focus{outline:2px solid var(--mint)}
.ract{display:inline-flex;gap:2px}
@media (min-width:720px){.tblwrap{display:block}.mcards{display:none}.stats4{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
.tbar .seg{display:flex;flex-wrap:nowrap;scrollbar-width:none}
.tbar .seg button{white-space:nowrap;flex:1 0 auto;padding-left:12px;padding-right:12px}
@media (max-width:719px){.tbar .seg{flex-basis:100%}.tsearch{max-width:none;flex-basis:100%}}
@media (min-width:1080px){main.formpage ~ .dfoot{display:none}main.formpage{padding-bottom:140px}}

function liveItems(){const n=Date.now();const allD=LISTINGS.filter(l=>l.mode==='drop'&&l.status==='active'&&l.endsAt>n&&l.seller!=='me');const d=allD.filter(DROP_OK).sort((a,b)=>a.endsAt-b.endsAt);const a=LISTINGS.filter(l=>l.mode==='auction'&&l.status==='active'&&l.endsAt>n).sort((x,y)=>x.endsAt-y.endsAt);return {d,a,allD}}
const urg=(t,hot)=>{const m=(t-Date.now())/6e4;return m<hot?'t-hot':m<hot*6?'t-warn':''};
function liveStrip(){const {d,a}=liveItems();if(!d.length&&!a.length)return '';const items=[...d.map(l=>['d',l]),...a.map(l=>['a',l])].sort((x,y)=>x[1].endsAt-y[1].endsAt);
 return `<div class="lstrip" role="region" aria-label="Live now"><span class="lst-l"><span class="pulse"></span>LIVE</span><div class="lst-r">${items.map(([k,l])=>`<button class="lchip ${k==='d'?'ld':'la'}" onclick="openItem('${l.id}')"><span class="lc-ph">${thumb(l)}</span><span class="lc-t"><b>${esc(l.title.split(/[,(]/)[0])}</b><span>${k==='d'?ic('flame','icon i12')+fmt(l.price):ic('hammer','icon i12')+fmt(curBid(l)||l.minBid)} · <span class="mono ${urg(l.endsAt,k==='d'?10:60)}" data-ends="${l.endsAt}">${left(l.endsAt)}</span></span></span></button>`).join('')}</div></div>`}
function endingBoard(){const {d,a,allD}=liveItems();if(!allD.length&&!a.length)return '';const hn=U('me').hostel;
 const row=(l,k)=>`<div class="erow"><button class="er-ph" onclick="openItem('${l.id}')">${photo(l)}</div></button><button class="er-t" onclick="openItem('${l.id}')"><b>${esc(l.title)}</b><span class="xs muted">${k==='d'?`${fmt(l.price)} · ${esc(U(l.seller).hostel)}${near(l)?' · <span class="near">your hostel</span>':''}`:`${l.bids.length?'Top bid':'Starts at'} <b class="tx-ink">${fmt(curBid(l)||l.minBid)}</b> · ${l.bids.length} bid${l.bids.length===1?'':'s'}${l.mrp?' · worth '+fmt(l.mrp)+' new':''}`}</span></button>
  <span class="er-tm ${urg(l.endsAt,k==='d'?10:60)}">${ic(k==='d'?'flame':'hourglass','icon i14')}<span class="mono" data-ends="${l.endsAt}">${left(l.endsAt)}</span></span>
  ${k==='d'?`<button class="btn small er-b" onclick="need(&quot;claim('${l.id}')&quot;,'Sign in to claim this food drop before it is gone')">${ic('zap')}Claim</button>`:`<button class="btn small er-b" onclick="need(&quot;go('item','${l.id}');openSheet('bid','${l.id}')&quot;,'Sign in to bid')">${ic('hammer')}Bid ${fmt(nextBid(l))}</button>`}</div>`;
 const col=(icn,t,sub,items,k,more)=>`<div class="panel eb-col"><div class="between eb-h"><span><b>${ic(icn)}${t}</b><span class="xs muted">${sub}</span></span><a onclick="${more}">See all${ic('chev','icon i14')}</a></div>${items.length?items.slice(0,4).map(l=>row(l,k)).join(''):`<p class="faint sm" style="padding:10px 4px">Nothing live right now.</p>`}</div>`;
 return `<section class="sec ending"><div class="sh"><h2><span class="pulse" style="position:static;margin-right:2px"></span>Ending soon</h2><span class="xs muted">Timers are live. First come, first served.</span></div><div class="eb">${S.authed?col('flame','Food drops in '+esc(hn),`${d.length} live · only people in ${esc(hn)} can see these${allD.length>d.length?` · ${allD.length-d.length} more in other hostels`:''}`,d,'d',"browse('food')"):`<div class="panel eb-col eb-lock"><div class="eb-h"><span><b>${ic('flame')}Food drops</b><span class="xs muted">Hostel-only. ${allD.length} live across campus right now</span></span></div><div class="lockbox"><span class="lk-ic">${ic('lock','icon i24')}</span><b>Food drops stay inside your hostel</b><span class="sm muted">Sign in and set your hostel to see extra food being shared by people on your floor. Pickup is a short walk, so it is still warm.</span><button class="btn small" onclick="openAuth({reason:'Sign in to see food drops in your hostel'},&quot;browse('food')&quot;)">${ic('user')}Sign in to see your hostel's drops</button></div></div>`}${col('hammer','Live auctions',`${a.length} running · highest bid wins`,a,'a',"browse('all',{modes:['auction']})")}</div></section>`}
function heroSide(drops){const me=U('me');const pend=S.authed?DEALS.filter(d=>d.stage>=lastStage(d)-1&&!d.rated).length:0;const nreq=REQUESTS.length;

function actBar(l,mine){const s=U(l.seller);const chat=`<button class="sqbtn" onclick="openChat('${s.id}','${l.id}')" aria-label="Chat with seller">${ic('chat')}</button>`;
 if(l.status!=='active'&&!(mine&&l.status==='paused'))return `<div class="actbar"><div class="pr"><b>No longer available</b><span>This item was ${l.status}</span></div><button class="btn sec" onclick="back()">Go back</button></div>`;
 if(mine)return `<div class="actbar"><button class="sqbtn" style="color:var(--bad)" aria-label="Delete listing" onclick="openSheet('del','${l.id}')">${ic('trash')}</button><div class="pr"><b>${fmt(priceOf(l))}</b><span>${l.status==='paused'?'Paused · hidden from search':'Your listing'}</span></div><button class="btn" onclick="editListing('${l.id}')">${ic('edit')}Edit</button></div>`;
 const pr=(a,b)=>`<div class="pr"><b>${a}</b><span>${b}</span></div>`;
 if(l.mode==='rent'&&l.unit==='hr')return `<div class="actbar">${chat}${pr(fmt(l.price)+'/hr','+ '+fmt(l.deposit)+' deposit')}<button class="btn" onclick="openSheet('hours','${l.id}')">${ic('clock')}Book hours</button></div>`;
 if(l.mode==='rent')return `<div class="actbar">${chat}${pr(fmt(l.price)+'/'+l.unit,'+ '+fmt(l.deposit)+' deposit')}<button class="btn" onclick="openSheet('dates','${l.id}')">${ic('cal')}Choose dates</button></div>`;
 if(l.mode==='auction')return `<div class="actbar">${chat}${pr(fmt(curBid(l)||l.minBid),`<span class="mono" data-ends="${l.endsAt}">${left(l.endsAt)}</span> left`)}<button class="btn" onclick="openSheet('bid','${l.id}')">${ic('hammer')}Place bid</button></div>`;
 if(l.mode==='drop')return `<div class="actbar">${chat}${pr(fmt(l.price),'First to claim gets it')}<button class="btn" onclick="claim('${l.id}')">${ic('zap')}Claim it</button></div>`;
 if(l.price===0)return `<div class="actbar">${chat}${pr('Free','Just pick it up')}<button class="btn" onclick="openSheet('buy','${l.id}')">${ic('gift')}I want this</button></div>`;
 return `<div class="actbar">${chat}<button class="btn sec" style="padding:0 16px" onclick="S.offerAmt='${Math.round(l.price*.9/10)*10}';openSheet('offer','${l.id}')">${ic('tag')}Offer</button><button class="btn" style="flex:1" onclick="openSheet('buy','${l.id}')">Buy ${fmt(l.price)}</button></div>`}

/* ======================= sheets ======================= */
function openSheet(k,arg){S.sheet={k,arg};renderLayer();setTimeout(()=>document.querySelector('.sheet input:not([type=range]):not([type=checkbox])')?.focus?.(),280)}
function closeSheet(){S.sheet=null;renderLayer()}
const shead=(icn,t,sub)=>`<div class="grab"></div><div class="shd"><div><h2>${ic(icn)}${t}</h2>${sub?`<div class="faint sm" style="margin-top:2px">${sub}</div>`:''}</div><button class="x" onclick="closeSheet()" aria-label="Close">${ic('x')}</button></div>`;
const SHEETS={
 filters(){const f=S.f;const sizes=[...new Set(LISTINGS.filter(l=>l.size&&(S.qcat==='all'||l.cat===S.qcat)).map(l=>l.size))];const cnt=results().length;
  return shead('filter','Filters')+`<div class="stack" style="gap:20px">
  <div class="field"><span class="label">${ic('bag')}Deal type</span><div class="chips">${[['sell','Buy','bag'],['rent','Rent','repeat'],['auction','Auction','hammer'],['drop','Food drop','flame']].map(([k,n,i])=>`<button class="chip ${f.modes.includes(k)?'on':''}" onclick="S.f.modes=S.f.modes.includes('${k}')?S.f.modes.filter(x=>x!=='${k}'):[...S.f.modes,'${k}'];renderLayer()">${ic(i)}${n}</button>`).join('')}</div></div>
  <button class="between" onclick="S.f.near=!S.f.near;renderLayer()" style="width:100%"><span class="row">${ic('pin')}In my hostel</span><span class="sw ${f.near?'on':''}"></span></button>
  <button class="between" onclick="S.f.trusted=!S.f.trusted;renderLayer()" style="width:100%"><span class="row">${ic('shield')}Trusted sellers only</span><span class="sw ${f.trusted?'on':''}"></span></button>
  <div class="field"><span class="label">${ic('cal')}Available on</span><div class="chiprow" style="margin:0;padding:2px 0 6px">${[0,1,2,3,4,5,6].map(o=>`<button class="chip ${f.needBy===o?'on':''}" onclick="S.f.needBy=${f.needBy===o?'null':o};renderLayer()">${dayLabel(o,true)}</button>`).join('')}</div></div>
  ${sizes.length?`<div class="field"><span class="label">${ic('ruler')}Size</span><div class="chips">${sizes.map(z=>`<button class="chip ${f.size===z?'on':''}" onclick="S.f.size=${f.size===z?'null':`'${z}'`};renderLayer()">${esc(z)}</button>`).join('')}</div></div>`:''}
  <div class="field"><span class="label">${ic('hourglass')}Product age</span><div class="chips">${[[6,'Under 6 months'],[12,'Under 1 year'],[24,'Under 2 years']].map(([m,n])=>`<button class="chip ${f.age===m?'on':''}" onclick="S.f.age=${f.age===m?'null':m};renderLayer()">${n}</button>`).join('')}</div></div>
  <div class="field"><span class="label">${ic('rupee')}Price</span><div class="row"><input class="input" inputmode="numeric" placeholder="Min" value="${f.min}" onchange="S.f.min=this.value.replace(/\\D/g,'');renderLayer()" aria-label="Minimum price"><span class="faint">to</span><input class="input" inputmode="numeric" placeholder="Max" value="${f.max}" onchange="S.f.max=this.value.replace(/\\D/g,'');renderLayer()" aria-label="Maximum price"></div></div>
  <div class="row" style="position:sticky;bottom:0;background:var(--surface);padding-top:10px"><button class="btn sec" onclick="S.f={...S.f,modes:[],near:false,trusted:false,needBy:null,size:null,age:null,min:'',max:''};renderLayer()">Clear</button><button class="btn" style="flex:1" onclick="closeSheet();render()">Show ${cnt} item${cnt===1?'':'s'}</button></div></div>`},
 sort(){return shead('sort','Sort by')+`<div class="lgroup" style="box-shadow:none">${SORTS.map(([k,n,i])=>`<button class="lrow" onclick="S.f.sort='${k}';closeSheet();render()"><span class="li">${ic(i)}</span><span class="lt"><b>${n}</b></span>${S.f.sort===k?ic('check','icon',2.6):''}</button>`).join('')}</div>`},
 hostel(){const me=U('me');return shead('pin','Where should people meet you?','Your hostel is your pickup point')+`<div class="lgroup" style="box-shadow:none">${[...HOSTELS,'Day scholar'].map(h=>`<button class="lrow" onclick="USERS.me.hostel='${h}';closeSheet();render();toast('Pickup point set to ${h}')"><span class="li">${ic(h==='Day scholar'?'home':'bed')}</span><span class="lt"><b>${h}</b></span>${me.hostel===h?ic('check','icon',2.6):''}</button>`).join('')}</div>`},
 dates(){const l=LI(S.sheet.arg);const [a,b]=S.range;const n=a!=null?(b!=null?b-a+1:1):0;const ud=l.unit==='week'?7:l.unit==='month'?30:1;const units=Math.max(1,Math.ceil(n/ud));const rent=units*l.price;
  return shead('cal','Choose your dates',`${fmt(l.price)}/${l.unit} · ${fmt(l.deposit)} refundable deposit`)+`<div class="stack" style="gap:14px">
  <span class="label">${a==null?'Tap your pickup day':b==null?'Now tap your return day':'Your dates'}</span>
  <div class="days">${[...Array(14)].map((_,o)=>{const d=dayDate(o);const bk=l.booked.includes(o);const inR=a!=null&&b!=null&&o>a&&o<b;const edge=o===a||o===b;const blocked=a!=null&&b==null&&o>a&&l.booked.some(x=>x>a&&x<=o);return `<button class="day ${inR?'in':''} ${edge?'edge':''}" ${bk||blocked?'disabled':''} onclick="pickDay(${o})"><span>${o===0?'Today':d.toLocaleDateString('en-IN',{weekday:'short'})}</span><b>${d.getDate()}</b></button>`}).join('')}</div>
  ${n?`<div class="calc"><div><span>${fmt(l.price)} × ${units} ${l.unit}${units>1?'s':''}</span><span>${fmt(rent)}</span></div><div><span>Refundable deposit</span><span>${fmt(l.deposit)}</span></div><div class="tot"><span>Pay at pickup</span><span>${fmt(rent+l.deposit)}</span></div><div class="faint xs" style="display:block">Pickup ${dayLabel(a,true)}, return by ${dayLabel(b??a,true)}.</div></div>`:''}
  <button class="btn block" ${n?'':'disabled'} onclick="reqRent('${l.id}')">${n?'Request to rent':'Select dates'}</button>
  <div class="note">${ic('shield')}<span>Free to cancel before pickup. Take condition photos at handover.</span></div></div>`},
 hours(){const l=LI(S.sheet.arg);if(S.hfor!==l.id){S.hfor=l.id;S.hr=[];S.hday=[...Array(14).keys()].find(d=>freeHrs(l,d).length)??0}const d=S.hday,[a,b]=S.hr;const booked=l.slots[d]||[];const n=a!=null?((b??a)-a+1):0;
  const cell=h=>{const bk=booked.includes(h),past=d===0&&h<=nowHr();const inR=a!=null&&b!=null&&h>a&&h<b;const edge=h===a||h===b;return `<button class="slot ${bk?'bk':''} ${past?'past':''} ${inR?'in':''} ${edge?'edge':''}" ${bk||past?'disabled':''} onclick="pickHour(${h})" aria-label="${hrLabel(h)}">${h%12||12}<small>${h<12?'am':'pm'}</small></button>`};
  return shead('clock','Book by the hour',`${fmt(l.price)}/hr · ${fmt(l.deposit)} refundable deposit`)+`<div class="stack" style="gap:12px">
  <span class="label">${ic('cal')}1. Pick a day</span>
  <div class="days">${[...Array(14)].map((_,o)=>{const dt=dayDate(o);const fr=freeHrs(l,o).length;const bk=(l.slots[o]||[]).length;return `<button class="day ${o===d?'edge':''}" ${fr?'':'disabled'} onclick="S.hday=${o};S.hr=[];renderLayer()"><span>${o===0?'Today':dt.toLocaleDateString('en-IN',{weekday:'short'})}</span><b>${dt.getDate()}</b><i class="dbar"><i style="width:${Math.round(bk/24*100)}%"></i></i></button>`}).join('')}</div>
  <div class="between"><span class="label">${ic('clock')}2. Pick hours · ${dayLabel(d,true)}</span>${a!=null?`<button class="btn quiet small" style="min-height:28px" onclick="S.hr=[];renderLayer()">Clear</button>`:''}</div>
  <div class="tl">${[['Night','moon',0],['Morning','sun',6],['Afternoon','sun',12],['Evening','sparkles',18]].map(([nm,i,st])=>`<span class="tlr">${ic(i)}${nm}</span>${[0,1,2,3,4,5].map(k=>cell(st+k)).join('')}`).join('')}</div>
  <div class="tleg"><span><i class="lg-f"></i>Free</span><span><i class="lg-b"></i>Booked</span><span><i class="lg-s"></i>Yours</span></div>
  <span class="faint xs">${a==null?'Tap your pickup hour, then the last hour you need it.':b==null?'Tap the last hour you need it, or book just this one.':''}</span>
  ${n?`<div class="calc"><div><span>${fmt(l.price)} × ${n} hr${n>1?'s':''}</span><span>${fmt(n*l.price)}</span></div><div><span>Refundable deposit</span><span>${fmt(l.deposit)}</span></div><div class="tot"><span>Pay at pickup</span><span>${fmt(n*l.price+l.deposit)}</span></div><div class="faint xs" style="display:block">${dayLabel(d,true)}: pick up ${hrLabel(a)}, return by ${hrLabel((b??a)+1)}.</div></div>`:''}
  <button class="btn block" ${n?'':'disabled'} onclick="reqHourly('${l.id}')">${n?`Book ${n} hour${n>1?'s':''}`:'Select hours'}</button>
  <div class="note">${ic('info')}<span>Sessions run late. Book a buffer hour; late returns are charged per hour.</span></div></div>`},
 bid(){const l=LI(S.sheet.arg);const c=curBid(l),nb=nextBid(l),inc=incr(c||l.minBid);const top=l.bids.slice().sort((x,y)=>y.amt-x.amt);const lead=top[0]?.u==='me';
  return shead('hammer','Place a bid',`Ends in ${left(l.endsAt)} · ${l.bids.length} bids`)+`<div class="stack" style="gap:14px">
  <div class="calc"><div><span>${c?'Current bid':'Starting bid'}</span><b>${fmt(c||l.minBid)}</b></div><div><span>Reserve</span><span>${c>=l.minBid?'Met':fmt(l.minBid)}</span></div>${l.mrp?`<div><span>Original price</span><span>${fmt(l.mrp)}</span></div>`:''}</div>
  ${lead?`<span class="badge b-near" style="align-self:flex-start;font-size:11px;padding:5px 10px">${ic('trophy')}You are the highest bidder</span>`:''}
  <span class="label">One-tap bid</span><div class="bidg">${[nb,nb+inc,nb+inc*3].map(v=>`<button class="btn sec" style="padding:0" onclick="bid('${l.id}',${v})">${fmt(v)}</button>`).join('')}</div>
  <div class="row"><input id="bidAmt" class="input" inputmode="numeric" placeholder="${fmt(nb)} or more" aria-label="Custom bid"><button class="btn" onclick="bid('${l.id}',+document.getElementById('bidAmt').value.replace(/\\D/g,''))">Bid</button></div>
  ${l.buyNow?`<button class="btn mint block" onclick="buyNow('${l.id}',${l.buyNow})">${ic('zap')}Buy it now for ${fmt(l.buyNow)}</button>`:''}
  <div><span class="label">Bid history</span><div class="hist">${top.slice(0,5).map((b,i)=>`<div><span>${b.u==='me'?'You':esc(U(b.u).name.split(' ')[0]+' '+U(b.u).name.split(' ')[1][0]+'.')}${i===0?' <span class="badge b-auction">Top</span>':''}</span><span><b>${fmt(b.amt)}</b> <span class="faint xs">${ago(b.t)}</span></span></div>`).join('')||'<div class="faint">No bids yet</div>'}</div></div></div>`},
 buy(){const l=LI(S.sheet.arg);const W=['Today, evening','Tomorrow, morning','Tomorrow, evening','Ask in chat'];return shead(l.price?'bag':'gift',l.price?'Confirm purchase':'Ask for it',`${esc(l.title)}`)+`<div class="stack" style="gap:14px">
  <div class="ctxprod">${photo(l)}</div><div style="flex:1"><b>${l.price?fmt(l.price):'Free'}</b>${l.mrp&&l.price?` <span class="mrp">${fmt(l.mrp)}</span>`:''}<div class="faint xs">from ${esc(U(l.seller).name)} · ${esc(U(l.seller).hostel)}</div></div></div>
  <span class="label">${ic('clock')}When can you pick it up?</span><div class="chips">${W.map((x,i)=>`<button class="chip ${S.buyWhen===i?'on':''}" onclick="S.buyWhen=${i};renderLayer()">${x}</button>`).join('')}</div>
  <div class="note">${ic('wallet')}<span>Nothing is charged here. Pay ${esc(first(l.seller))} by UPI or cash at the handover.</span></div>
  <button class="btn block" onclick="confirmBuy('${l.id}','${W[S.buyWhen]}')">Send request to ${esc(first(l.seller))}</button></div>`},
 offer(){const l=LI(S.sheet.arg);const v=+S.offerAmt||0;return shead('tag','Make an offer',`Asking ${fmt(l.price)}${l.mrp?' · original '+fmt(l.mrp):''}`)+`<div class="stack" style="gap:14px">
  <div class="iwrap">${ic('rupee','icon i18')}<input id="ofa" class="input" inputmode="numeric" value="${S.offerAmt}" oninput="S.offerAmt=this.value.replace(/\\D/g,'')" aria-label="Offer amount" style="font-size:22px;font-weight:700"></div>
  <div class="chips">${[5,10,15,20].map(p=>`<button class="chip" onclick="S.offerAmt='${Math.round(l.price*(1-p/100)/10)*10}';renderLayer()">${p}% less · ${fmt(Math.round(l.price*(1-p/100)/10)*10)}</button>`).join('')}</div>
  <div class="note">${ic('info')}<span>${esc(first(l.seller))} can accept, counter or decline. Offers above 85% of the asking price are usually accepted.</span></div>
  <button class="btn block" onclick="const v=+(document.getElementById('ofa').value||'').replace(/\\D/g,'');if(!v){toast('Enter an amount');return}closeSheet();openChat('${l.seller}','${l.id}');sendOffer('${l.seller}',v)">Send offer</button></div>`},
 /* [RUBRIC:CRUD-DELETE] Confirm dialog that explains exactly what happens, with guard rails. */
 del(){const l=LI(S.sheet.arg);const busyRent=DEALS.some(d=>d.item===l.id&&d.kind==='rental'&&d.stage<lastStage(d)-1);
  if(l.mode==='auction'&&l.bids.length)return shead('alert','Can\'t delete this auction',`${l.bids.length} people have bid on it`)+`<div class="stack" style="gap:12px"><p class="sm muted">Deleting would cancel their bids without warning. End the auction instead: you can sell to any bidder or close it without selling.</p><button class="btn block" onclick="openSheet('closeauc','${l.id}')">${ic('hammer')}End auction instead</button><button class="btn sec block" onclick="closeSheet()">Keep it</button></div>`;
  if(busyRent)return shead('alert','Can\'t delete while it is rented','Someone has an active or upcoming booking')+`<div class="stack" style="gap:12px"><p class="sm muted">Pause it so no new bookings come in. You can delete it after the item is returned.</p><button class="btn block" onclick="togglePause('${l.id}')">${ic('pause')}Pause instead</button><button class="btn sec block" onclick="closeSheet()">Cancel</button></div>`;
  return shead('trash','Delete this listing?',esc(l.title))+`<div class="stack" style="gap:12px"><div class="ctxprod">${photo(l)}</div><div style="flex:1;min-width:0"><b class="sm" style="display:block">${esc(l.title)}</b><span class="xs muted">${fmt(priceOf(l))} · ${l.views} views · ${l.saves} saves</span></div></div>
  <ul class="bullets sm"><li>It disappears from search, home and people's saved lists right away.</li><li>Chats about it stay, with a "listing deleted" note, so buyers know what happened.</li><li>You can restore it from My listings for 30 days.</li></ul>
  <div class="row"><button class="btn sec" style="flex:1" onclick="closeSheet()">Cancel</button><button class="btn danger" style="flex:1" onclick="deleteListing('${l.id}')">${ic('trash')}Delete</button></div></div>`},
 manage(){const l=LI(S.sheet.arg);return shead('settings','Manage listing',esc(l.title))+`<div class="lgroup" style="box-shadow:none">
  ${l.mode==='auction'?`<button class="lrow" onclick="openSheet('closeauc','${l.id}')"><span class="li">${ic('hammer')}</span><span class="lt"><b>End auction and choose a buyer</b><span>${l.bids.length} bids</span></span>${ic('chev')}</button>`:`<button class="lrow" onclick="openSheet('sold','${l.id}')"><span class="li">${ic('check')}</span><span class="lt"><b>Mark as sold</b><span>Pick the buyer to rate each other</span></span>${ic('chev')}</button>`}
  <button class="lrow" onclick="editListing('${l.id}')"><span class="li">${ic('edit')}</span><span class="lt"><b>Edit listing</b><span>Change price, photos, details</span></span>${ic('chev')}</button>
  <button class="lrow" onclick="togglePause('${l.id}')"><span class="li">${ic(l.status==='paused'?'play':'pause')}</span><span class="lt"><b>${l.status==='paused'?'Resume listing':'Pause listing'}</b><span>${l.status==='paused'?'Show it in search again':'Hide from search without deleting'}</span></span></button>
  <button class="lrow" onclick="openSheet('del','${l.id}')"><span class="li" style="color:var(--bad)">${ic('trash')}</span><span class="lt"><b style="color:var(--bad)">Delete listing</b><span>You can undo this for 30 days</span></span></button>
  <button class="lrow" onclick="closeSheet();toast('Link copied')"><span class="li">${ic('share')}</span><span class="lt"><b>Share listing</b></span>${ic('chev')}</button></div>`},
 sold(){const l=LI(S.sheet.arg);return shead('check','Who bought it?','Other chats about this item get an automatic "sold" reply')+`<div class="lgroup" style="box-shadow:none">${Object.keys(THREADS).map(u=>`<button class="lrow" onclick="sold('${l.id}','${u}')">${av(u,36)}<span class="lt"><b>${esc(U(u).name)}</b><span>${esc(U(u).hostel)}</span></span>${ic('chev')}</button>`).join('')}<button class="lrow" onclick="LI('${l.id}').status='sold';closeSheet();render();toast('Marked as sold')"><span class="li">${ic('x')}</span><span class="lt"><b>Sold outside i-bay</b></span></button></div>`},
 closeauc(){const l=LI(S.sheet.arg);const top=l.bids.slice().sort((a,b)=>b.amt-a.amt);return shead('hammer','Choose a buyer','You can pick any bidder, not only the highest')+`<div class="lgroup" style="box-shadow:none">${top.map(b=>`<button class="lrow" onclick="sellTo('${l.id}','${b.u}',${b.amt})">${av(b.u,36)}<span class="lt"><b>${esc(U(b.u).name)} · ${fmt(b.amt)}</b><span>${trust(b.u).l} · ${U(b.u).txns} deals</span></span>${ic('chev')}</button>`).join('')||'<p class="faint pad">No bids yet.</p>'}<button class="lrow" onclick="LI('${l.id}').status='ended';closeSheet();go('shop',null,{root:1});toast('Auction ended without a sale')"><span class="li" style="color:var(--bad)">${ic('x')}</span><span class="lt"><b>End without selling</b></span></button></div>`},
 handover(){const d=DEALS.find(x=>x.id===S.sheet.arg);const st=stagesFor(d);const next=st[d.stage+1];return shead('check','Confirm: '+next.toLowerCase(),next==='Returned'?'Check the item together before the deposit goes back':'Take 2 or 3 photos together. They protect both of you.')+`<div class="stack" style="gap:12px">
  ${[['camera','We took condition photos'],...(next==='Returned'?[['wallet','Deposit returned']]:[['wallet','Payment done']])].map(([i,t])=>`<label class="between" style="padding:12px 14px;border-radius:16px;background:var(--sunken);box-shadow:var(--shw)"><span class="row">${ic(i)}${t}</span><input type="checkbox" checked style="width:22px;height:22px;accent-color:var(--brand)"></label>`).join('')}
  <button class="btn block" onclick="advanceDeal('${d.id}')">Confirm</button></div>`},
 rate(){return rateBody()},
 req(){return shead('list','I am looking for a...','People who have it reply with a photo and price')+`<div class="stack" style="gap:14px">
  <input id="rq" class="input" placeholder="e.g. orange kurta, size M" value="${esc(S.reqDraft||'')}" oninput="S.reqDraft=this.value" aria-label="What are you looking for">
  <div class="field"><span class="label">${ic('grid')}Category</span><select id="rqc" class="input">${CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
  <div class="field"><span class="label">${ic('rupee')}Budget</span><input id="rqb" class="input" placeholder="e.g. Rent up to ₹200/day"></div>
  <div class="field"><span class="label">${ic('cal')}Needed by</span><div class="chips">${[null,0,1,2,3,6].map(o=>`<button class="chip ${S.reqNeed===o?'on':''}" onclick="S.reqNeed=${o};S.reqDraft=document.getElementById('rq').value;renderLayer()">${o==null?'No rush':dayLabel(o,true)}</button>`).join('')}</div></div>
  <button class="btn block" onclick="postReq()">${ic('send')}Post request</button></div>`},
 reqoffer(){const r=REQUESTS.find(x=>x.id===S.sheet.arg);return shead('img','I have this',`For: ${esc(r.text)}`)+`<div class="stack" style="gap:14px">
  <textarea id="rpt" class="input" placeholder="Size, colour, condition, where to pick up"></textarea>
  <div class="row"><input id="rpp" class="input" placeholder="Price, e.g. ₹150/day"><label class="sqbtn" style="cursor:pointer">${ic('camera')}<input type="file" accept="image/*" hidden onchange="readImg(this,'offer')"></label></div><span id="rpl" class="faint xs"></span>
  <button class="btn block" onclick="replyReq('${r.id}')">${ic('send')}Send offer</button></div>`}
};

/* [RUBRIC:CRUD-UPDATE] Quick inline price edit from the My listings table.
   Validates like the server would: whole rupees, at least 1, not above the original price. */
function quickPrice(id,v){const l=LI(id);const n=+String(v).replace(/\D/g,'');
 if(!n||n<1){toast('Price must be at least ₹1');render();return}
 if(l.mrp&&n>l.mrp){toast(`Price can't be more than the original price (${fmt(l.mrp)})`);render();return}
 const old=l.price;if(n===old)return;l.price=n;l.updated=Date.now();logEdit(l,{price:[old,n]});
 if(n<old){l.priceDrop={amt:old-n,t:Date.now()};toast(`Price dropped by ${fmt(old-n)}. People who saved it get an alert.`)}else toast('Price updated');render()}
/* [RUBRIC:CRUD-UPDATE] Pause hides a listing from search without deleting it. */
function togglePause(id){const l=LI(id);l.status=l.status==='paused'?'active':'paused';l.updated=Date.now();logEdit(l,{status:[l.status==='paused'?'active':'paused',l.status]});S.sheet=null;render();toast(l.status==='paused'?'Paused. It is hidden from search until you resume it.':'Live again')}
/* Keeps a small edit history on each listing (the real app writes this to audit_log). */
function logEdit(l,changes){(l.edits=l.edits||[]).unshift({t:Date.now(),changes})}
/* [RUBRIC:CRUD-UPDATE] Opens the same 3-step form, prefilled with the listing's current values. */
function editListing(id){const l=LI(id);if(!l||l.seller!=='me'){toast('You can only edit your own listings');return}
 const d=l.bought?new Date(l.bought):null;
 S.post={editId:id,mode:l.mode,photos:l.upl?[l.upl]:[],title:l.title,cat:l.cat,price:String(l.mode==='auction'?l.minBid:l.price??''),orig:l.mrp?String(l.mrp):'',unit:l.unit,deposit:l.deposit!=null?String(l.deposit):'',hours:l.mode==='auction'?24:.5,bm:d?d.getMonth():undefined,by:d?d.getFullYear():undefined,cond:l.cond,desc:(l.desc||[]).join(' '),specs:l.specs,sz:l.size,step:1,err:{}};
 S.sheet=null;go('new')}
/* [RUBRIC:CRUD-DELETE] Soft delete: the listing disappears everywhere at once but can be restored (Undo / Deleted tab). */

function saveEdit(p){const l=LI(p.editId);if(!l||l.seller!=='me'){toast('You can only edit your own listings');return}
 const ch={};const set=(k,v)=>{if(v!==undefined&&v!==l[k]){ch[k]=[l[k],v];l[k]=v}};
 const t=p.title.trim();set('title',t);if(l.mode!=='drop')set('cat',p.cat||guessCat(t)||l.cat);
 const np=+p.price||0;if(l.mode==='auction'){if(!l.bids.length)set('minBid',np)}else{const old=l.price;set('price',np);if(old&&np<old)l.priceDrop={amt:old-np,t:Date.now()}}
 set('mrp',+p.orig||undefined);if(l.mode==='rent')set('deposit',+p.deposit||0);set('cond',p.cond||l.cond);
 if(p.desc!=null&&p.desc!==(l.desc||[]).join(' ')){ch.description=['old','new'];l.desc=[p.desc]}
 if(l.mode!=='drop'&&l.cat!=='tickets'){const b=new Date(p.by??TODAY.getFullYear(),p.bm??TODAY.getMonth(),1).getTime();if(b!==l.bought){ch.bought=['old','new'];l.bought=b}}
 if(p.photos[0]&&p.photos[0]!==l.upl)l.upl=p.photos[0];if(p.sz)l.size=p.sz;
 l.updated=Date.now();if(Object.keys(ch).length)logEdit(l,ch);const id=l.id;S.post={mode:'sell',photos:[],title:'',step:1};S.hist=S.hist.filter(h=>h[0]!=='new');S.route='shop';go('item',id);toast(Object.keys(ch).length?'Changes saved':'No changes to save')}

/* [RUBRIC:VALIDATION-CLIENT] Checks one step of the listing form and returns {field: message}.

function validateListing(p,step){const e={};const c=p.mode==='drop'?'food':(p.cat||guessCat(p.title||''));const t=(p.title||'').trim();const free=/^free/i.test(t);

 if(step>=2){const pr=+p.price,o=+p.orig;
  if(!free&&!pr)e.price=p.mode==='auction'?'Set a starting bid.':'Add a price in whole rupees.';else if(pr>200000)e.price='That is above the ₹2,00,000 limit.';
  if(p.mode==='drop'&&pr>2000)e.price='Food drops can be at most ₹2,000.';
  if(p.mode!=='drop'&&c!=='tickets'&&!free){if(!o)e.orig='Add the original price you paid. Buyers use it to judge the deal.';else if(p.mode==='sell'&&pr>o)e.orig=`Your price (${fmt(pr)}) is more than what you paid (${fmt(o)}).`}
  if(p.mode==='rent'&&(p.deposit===''||p.deposit==null))e.deposit='Add a refundable deposit (₹0 is allowed).';
  if(p.mode!=='drop'&&c!=='tickets'){const d=new Date(p.by??TODAY.getFullYear(),p.bm??TODAY.getMonth(),1);if(d>Date.now())e.date='Purchase date can\'t be in the future.'}}
 return e}

 // [RUBRIC:CAPTCHA] new listings need the security check, verified on the server before saving

 if(m==='auction'){l.minBid=+p.price;l.endsAt=Date.now()+(+p.hours||24)*HR}else l.price=+p.price||0;
 if(m==='rent'){l.unit=p.unit||(c==='preprocess'?'hr':'day');l.deposit=+p.deposit||0;if(l.unit==='hr')l.slots={}}if(m==='drop')l.endsAt=Date.now()+(+p.hours||.5)*HR;
