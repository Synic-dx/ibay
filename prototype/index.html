  <button class="btn block" type="submit">${up?'Create account':'Send sign-in code'}${ic('arrow')}</button></form>
  <div class="sm" style="text-align:center">${up?'Already on i-bay? <a onclick="S.auth.mode=\'signin\';renderLayer()">Sign in</a>':'New here? <a onclick="S.auth.mode=\'signup\';renderLayer()">Create an account</a>'}</div></div>`;
 if(a.step==='google')body=`<div class="stack" style="gap:16px;align-items:center;text-align:center;padding:20px 0">${GLOGO.replace('width="20" height="20"','width="44" height="44"')}<h2>Connecting to Google...</h2><p class="sm muted">Checking that this is an @iimidr.ac.in account</p><div class="typing"><span></span><span></span><span></span></div></div>`;
 if(a.step==='otp')body=`<div class="stack" style="gap:14px"><button class="btn quiet small" style="align-self:flex-start;padding:0" onclick="S.auth.step='form';renderLayer()">${ic('back')}Change email</button>
  <div><h2 style="font-size:20px">Check your inbox</h2><p class="sm muted">Enter the 6-digit code sent to <b>${esc(a.email)}</b></p></div>
  <div class="otp" id="otp">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" oninput="otpIn(this,${i})" onkeydown="if(event.key==='Backspace'&&!this.value&&${i})this.previousElementSibling.focus()">`).join('')}</div>
  <div id="oerr" class="sm" style="color:var(--bad)"></div>
  <button class="btn block" onclick="verifyOtp()">Verify</button>
  <div class="between sm"><span class="faint">Expires in 10 min</span><button class="btn quiet small" onclick="toast('New code sent')">Resend</button></div>
  <div class="note">${ic('info')}<span>Prototype: any 6 digits work.</span></div></div>`;
 if(a.step==='onboard')body=`<div class="stack" style="gap:14px"><div class="row">${peacock(40)}<div><span class="faint sm">Welcome, ${esc(U('me').name.split(' ')[0])}</span><h2 style="font-size:20px">Where should people meet you?</h2></div></div>
  <div class="chips">${[...HOSTELS,'Day scholar'].map(h=>`<button class="chip ${U('me').hostel===h?'on':''}" onclick="USERS.me.hostel='${h}';renderLayer()">${h}</button>`).join('')}</div>
  <div class="iwrap">${ic('key','icon i18')}<input id="obr" class="input" placeholder="Room number" value="${esc(U('me').room)}"></div>
  <div class="iwrap">${ic('chat','icon i18')}<input id="obw" class="input" type="tel" placeholder="WhatsApp (optional)"></div>
  <button class="btn block" onclick="USERS.me.room=document.getElementById('obr').value;USERS.me.wa=document.getElementById('obw').value;finishAuth()">Start using i-bay</button><button class="btn quiet" onclick="finishAuth()">Skip for now</button></div>`;
 return `<div class="blurwrap" onclick="if(event.target===this)closeAuth()"><div class="authcard" role="dialog" aria-modal="true" aria-labelledby="authT"><button class="x" onclick="closeAuth()" aria-label="Close">${ic('x')}</button>${body}</div></div>`}
function authEmail(){const a=S.auth;const v=document.getElementById('aem').value.trim().toLowerCase();a.email=v;if(S.cap.auth!==2){a.capErr=1;renderLayer();return}if(a.mode==='signup'){a.name=(document.getElementById('anm')?.value||'').trim()}
 if(!/^[a-z0-9._%+-]+@iimidr\.ac\.in$/.test(v)){document.getElementById('aerr').textContent=v?'Only @iimidr.ac.in emails can use i-bay.':'Enter your institute email.';return}a.step='otp';renderLayer();setTimeout(()=>document.querySelector('#otp input')?.focus(),60)}
function otpIn(el,i){el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&i<5)el.nextElementSibling.focus();if([...el.parentNode.children].every(x=>x.value))verifyOtp()}
function verifyOtp(){const c=[...document.querySelectorAll('#otp input')].map(x=>x.value).join('');if(c.length<6){document.getElementById('oerr').textContent='Enter all 6 digits.';return}const a=S.auth;
 const nm=a.name||a.email.split('@')[0].replace(/[._\d]+/g,' ').trim().split(' ').filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');USERS.me.name=nm||'Student';S.email=a.email;a.step=a.mode==='signup'?'onboard':'done';if(a.step==='done')finishAuth();else renderLayer()}
function googleAuth(){if(S.cap.auth!==2){S.auth.capErr=1;renderLayer();return}S.auth.step='google';renderLayer();setTimeout(()=>{if(!S.auth)return;USERS.me.name=S.auth.name||'Campus Student';S.email='student@iimidr.ac.in';S.auth.step=S.auth.mode==='signup'?'onboard':'onboard';renderLayer()},1300)}
function finishAuth(){S.cap.auth=0;const next=S.auth?.next;S.authed=true;S.auth=null;toast('Welcome to i-bay, '+U('me').name.split(' ')[0]);if(next)(new Function(next))();else render()}

/* ======================= drawer ======================= */
function openDrawer(){if(innerWidth>=1080){go('explore',null,{root:1});return}S.drawer=true;renderLayer()}
function drawerV(){const me=U('me');const drops=LISTINGS.filter(l=>l.mode==='drop'&&l.status==='active'&&l.endsAt>Date.now()).length;
 const dl=(i,t,a,end='',cls='')=>`<button class="dl ${cls}" onclick="S.drawer=false;${a}">${ic(i)}<span>${t}</span>${end?`<span class="end">${end}</span>`:''}</button>`;
 return `<div class="scrim" onclick="S.drawer=false;renderLayer()"></div><nav class="drawer" aria-label="Menu">
 <div class="dhead">${S.authed?`<div class="row">${av('me',48)}<div><b style="font-size:16px">${esc(me.name)}</b><div class="xs" style="opacity:.85">${trust(me).l} · Plume ${Math.round(me.plume)}</div></div></div>`:`<div class="row">${peacock(40)}${logo(26)}</div><p class="sm" style="margin:10px 0 12px;opacity:.85">Browse freely. Sign in with your IIM Indore account to buy, rent or sell.</p><button class="btn mint small" onclick="S.drawer=false;openAuth({})">${ic('user')}Sign in</button>`}</div>
 ${S.authed?`<button class="dl" onclick="S.selling=!S.selling;renderLayer();render()">${ic('store')}<span>Selling mode</span><span class="end"><span class="sw ${S.selling?'on':''}" style="display:inline-block"></span></span></button>`:''}
 <div class="dsec">Shop</div>
 ${dl('home','Home',"go('home',null,{root:1})")}${dl('grid','All categories',"go('explore',null,{root:1})")}${dl('drama','Preprocess Store',"browse('preprocess')",'Hourly','hot')}${dl('dumbbell','Gym Corner',"browse('gym')")}${dl('hammer','Live auctions',"browse('all',{modes:['auction']})")}${dl('repeat','Rentals',"browse('all',{modes:['rent']})")}${dl('flame','Food drops',"browse('food')",drops?drops+' live':'')}${dl('book','Novels & manga',"browse('reads')")}${dl('gift','Free stuff',"browse('free')")}${dl('list','Looking for...',"need(&quot;go('requests')&quot;,'Sign in to see and post requests')")}
 <div class="dsec">Categories</div>
 ${['Seasons','Study','Hostel life','Play'].map(g=>`<button class="dl" onclick="S.dg['${g}']=!S.dg['${g}'];renderLayer()">${ic(GRP_IC[g])}<span>${g}</span><span class="end">${ic(S.dg[g]?'down':'chev','icon i16')}</span></button>${S.dg[g]?CATS.filter(c=>c.g===g).map(c=>`<button class="dl dsub" onclick="S.drawer=false;browse('${c.id}')">${c.name}</button>`).join(''):''}`).join('')}
 ${S.authed?`<div class="dsec">You</div>${dl('bag','Your deals',"go('deals')")}${dl('heart','Saved',"go('saved')",SAVED.size||'')}${dl('store','My listings',"go('shop')")}${dl('pin','Hostel & contact',"go('account')")}${dl('bell','Notifications',"go('notifs')")}`:''}
 <div class="dsec">More</div>
 <button class="dl" onclick="toggleTheme();S.drawer=true;renderLayer()">${ic(THEME==='dark'?'moon':'sun')}<span>Dark mode</span><span class="end"><span class="sw ${THEME==='dark'?'on':''}" style="display:inline-block"></span></span></button>
 ${dl('help','How trust works',"go('trust')")}${dl('sparkles','Ask Mayu',"S.bot=true;renderLayer()")}
 ${S.authed?dl('logout','Sign out','signOut()'):''}
 <p class="faint xs" style="padding:18px">i-bay is only for verified @iimidr.ac.in accounts.</p></nav>`}

/* ======================= Mayu ======================= */
function botV(){return `<div class="scrim" onclick="S.bot=false;renderLayer()"></div><div class="sheet tall" role="dialog" aria-label="Mayu"><div class="grab"></div>
 <div class="shd"><div class="row">${peacock(38)}<div><h2>Mayu</h2><span class="faint xs">Finds things on i-bay · GPT-4o</span></div></div><button class="x" onclick="S.bot=false;renderLayer()" aria-label="Close">${ic('x')}</button></div>
 <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px" id="botb">${S.botMsgs.map(m=>m.f==='me'?`<div class="bm me">${esc(m.x)}</div>`:m.typing?`<div class="bm them typing"><span></span><span></span><span></span></div>`:`<div class="bm them">${m.x}${(m.items||[]).map(l=>`<button class="mini" onclick="S.bot=false;openItem('${l.id}')">${photo(l)}</div><span style="flex:1;min-width:0"><span class="sm" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.title)}</span><b>${fmt(priceOf(l))}${l.unit?'<span class="faint" style="font-weight:400">/'+(l.unit==='hr'?'hr':l.unit)+'</span>':''}</b>${l.mrp?` <span class="mrp">${fmt(l.mrp)}</span>`:''} <span class="faint xs">· ${hasAge(l)?ageText(ageM(l)):''}</span></span></button>`).join('')}</div>`).join('')}</div>
 <div style="padding:8px 0 calc(12px + var(--safe-b));border-top:1px solid var(--line)"><div class="qr">${['Cheapest fx-991ES','Yonex racquets','One Piece manga','How does trust work?'].map(s=>`<button onclick="ask('${s}')">${s}</button>`).join('')}</div>
 <form class="cin" onsubmit="event.preventDefault();ask(document.getElementById('bq').value)"><input id="bq" placeholder="Ask Mayu to find something" aria-label="Ask Mayu" autocomplete="off"><button class="rb send" type="submit" aria-label="Send">${ic('send')}</button></form></div></div>`}
function ask(q){q=(q||'').trim();if(!q)return;S.botMsgs.push({f:'me',x:q},{typing:1});renderLayer();setTimeout(()=>{S.botMsgs.pop();S.botMsgs.push(answer(q));renderLayer()},800)}

/* ======================= desktop messaging dock (LinkedIn style) ======================= */
S.dock={open:false,win:null,wmin:false,draft:'',q:''};
function isDesk(){return innerWidth>=1080}
function dockScroll(){const m=document.getElementById('dkm');if(m)m.scrollTop=m.scrollHeight}
function dockToggle(){if(!S.authed){openAuth({reason:'Sign in to message buyers and sellers'});return}S.dock.open=!S.dock.open;renderLayer()}
function dockOpen(uid){THREADS[uid].unread=0;S.dock.win=uid;S.dock.wmin=false;S.dock.draft='';render();dockScroll();setTimeout(()=>document.getElementById('dci')?.focus(),30)}
function dockV(){if(!isDesk()||S.route==='thread')return '';const un=S.authed?Object.values(THREADS).reduce((a,t)=>a+t.unread,0):0;const d=S.dock;
 const ids=Object.keys(THREADS).sort((a,b)=>(THREADS[b].msgs.at(-1)?.t||0)-(THREADS[a].msgs.at(-1)?.t||0)).filter(k=>!d.q||U(k).name.toLowerCase().includes(d.q.toLowerCase()));
 let win='';if(S.authed&&d.win&&THREADS[d.win]){const uid=d.win,u=U(uid),th=THREADS[uid],l=th.item&&LI(th.item),dl=th.deal&&DEALS.find(x=>x.id===th.deal);
  win=`<section class="dk-win ${d.wmin?'min':''}" aria-label="Chat with ${esc(u.name)}"><header class="dk-h" onclick="S.dock.wmin=!S.dock.wmin;renderLayer();dockScroll()">${av(uid,30)}<span class="dk-t"><b>${esc(u.name)}</b><span>${trustLine(uid,false)}</span></span>
   <button class="dk-ib" onclick="event.stopPropagation();go('thread','${uid}')" aria-label="Open full chat" title="Open full chat">${ic('expand','icon i16')}</button><button class="dk-ib" onclick="event.stopPropagation();S.dock.wmin=!S.dock.wmin;renderLayer();dockScroll()" aria-label="Minimise">${ic(d.wmin?'up':'min','icon i16')}</button><button class="dk-ib" onclick="event.stopPropagation();S.dock.win=null;renderLayer()" aria-label="Close chat">${ic('x','icon i16')}</button></header>
   ${d.wmin?'':`${l?`<button class="dk-ctx" onclick="go('item','${l.id}')">${photo(l)}</div><span><b>${esc(l.title)}</b><span>${fmt(priceOf(l))}${l.unit?'/'+(l.unit==='hr'?'hr':l.unit):''}${l.mrp?' · worth '+fmt(l.mrp)+' new':''}</span></span></button>`:''}
   ${dl?`<div class="dealbar">${ic('check','icon i14',2.6)} Deal agreed · ${fmt(dl.amt)} <a onclick="go('deals')" style="margin-left:auto;color:inherit;font-weight:700">Track ›</a></div>`:''}
   <div class="dk-msgs msgs" id="dkm">${msgList(uid)||'<p class="faint sm" style="text-align:center;margin:auto">Say hi. Ask about condition, pickup or price.</p>'}</div>
   <div class="qr dk-qr">${(th.msgs.length?['When can I pick it up?','On my way','Is the price final?']:['Is this still available?','Is the price negotiable?']).map(q=>`<button onclick="sendMsg('${uid}','${q}','dci')">${q}</button>`).join('')}</div>
   <form class="cin dk-cin" onsubmit="event.preventDefault();sendMsg('${uid}',undefined,'dci')">${l?`<button type="button" class="rb ofb" onclick="sendOffer('${uid}',0,'dci')" aria-label="Send amount as an offer" title="Send as offer">${ic('rupee')}</button>`:''}<input id="dci" placeholder="Write a message, or an amount to offer" value="${esc(d.draft)}" oninput="S.dock.draft=this.value" autocomplete="off" aria-label="Message"><button class="rb send" type="submit" aria-label="Send">${ic('send')}</button></form>`}</section>`}
 const op=d.open&&S.authed;
 const list=`<section class="dk-list ${op?'open':''}"><header class="dk-h" onclick="dockToggle()">${S.authed?av('me',30):`<span class="dk-av">${ic('chat','icon i16')}</span>`}<span class="dk-t"><b>Messaging</b></span>${un?`<i class="cnt" style="position:static;border:0">${un}</i>`:''}<span class="dk-ib" aria-hidden="true">${ic(op?'down':'up','icon i16')}</span></header>
  ${op?`<div class="dk-search">${ic('search','icon i16')}<input placeholder="Search messages" value="${esc(d.q)}" oninput="S.dock.q=this.value;renderLayer();const i=document.querySelector('.dk-search input');i.focus();i.setSelectionRange(i.value.length,i.value.length)" aria-label="Search messages"></div>
  <div class="dk-threads">${ids.map(k=>{const t=THREADS[k],u=U(k),m=t.msgs.at(-1),li=t.item&&LI(t.item);return `<button class="dk-row ${t.unread?'unread':''} ${d.win===k?'on':''}" onclick="dockOpen('${k}')">${av(k,40)}<span class="tx"><span class="between"><b>${esc(u.name)}</b><span class="faint xs">${m?ago(m.t):''}</span></span><span class="xs" style="color:var(--brand-ink)">${li?esc(li.title):esc(u.hostel)}</span><span class="dk-last">${m?(m.f==='me'?'You: ':'')+(m.offer?'Offer '+fmt(m.amt):esc(m.x)):'New chat'}</span></span>${t.unread?`<i class="cnt" style="position:static;border:0">${t.unread}</i>`:''}</button>`}).join('')||'<p class="faint sm pad">No chats yet.</p>'}</div>`:''}</section>`;
 const mayu=`<button class="dk-mayu" onclick="S.bot=true;if(!S.botMsgs.length)S.botMsgs.push({x:'Hi, I am <b>Mayu</b>! Tell me what you need. Try &quot;cheapest fx-991ES&quot; or &quot;Yonex racquets&quot;.'});renderLayer()" aria-label="Ask Mayu, the shopping assistant">${peacock(28)}<b>Ask Mayu</b></button>`;
 return `<div class="dock">${win}${list}</div>`}
window.addEventListener('resize',(()=>{let t,w=isDesk();return()=>{clearTimeout(t);t=setTimeout(()=>{if(isDesk()!==w){w=isDesk();render()}},150)}})());

/* ======================= layer ======================= */
function renderLayer(){const el=document.getElementById('layer');const showMayu=['home','explore','browse','requests','you','saved'].includes(S.route)&&!S.sheet&&!S.bot&&!S.drawer;
 el.innerHTML=(showMayu?`<button class="mayu" aria-label="Ask Mayu, the shopping assistant" onclick="S.bot=true;if(!S.botMsgs.length)S.botMsgs.push({x:'Hi, I am <b>Mayu</b>! Tell me what you need. Try &quot;cheapest fx-991ES&quot; or &quot;Yonex racquets&quot;.'});renderLayer()">${peacock(40)}</button>`:'')
 +(S.drawer?drawerV():'')+(S.sheet&&SHEETS[S.sheet.k]?`<div class="scrim" onclick="closeSheet()"></div><div class="sheet" role="dialog" aria-modal="true">${SHEETS[S.sheet.k]()}</div>`:'')
 +dockV()+(S.bot?botV():'')+(S.auth?authV():'');
 const bb=document.getElementById('botb');if(bb)bb.scrollTop=bb.scrollHeight;
 document.body.style.overflow=(S.sheet||S.drawer||S.bot||S.auth)?'hidden':''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.auth)closeAuth();else if(S.sheet)closeSheet();else if(S.drawer){S.drawer=false;renderLayer()}else if(S.bot){S.bot=false;renderLayer()}}});
setInterval(()=>document.querySelectorAll('[data-ends]').forEach(e=>{const t=+e.dataset.ends;if(t)e.textContent=left(t)}),1000);
NOTIFS.forEach((n,i)=>n.i=n.i||['hammer','chat','star'][i]);
render();

</script>
</body>
</html>
